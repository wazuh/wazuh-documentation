paths:
  /_plugins/_security/api/roles:
    get:
      tags:
        - Roles
      summary: List roles
      description: Returns every role, keyed by name.
      operationId: listRoles
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/Role'
              example:
                all_access:
                  reserved: true
                  hidden: false
                  static: true
                  description: "Allow full access to all indices and all cluster APIs"
                  cluster_permissions:
                    - "*"
                  index_permissions:
                    - index_patterns: ["*"]
                      allowed_actions: ["*"]
                  tenant_permissions:
                    - tenant_patterns: ["*"]
                      allowed_actions: ["kibana_all_write"]
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags:
        - Roles
      summary: Patch roles (bulk)
      description: |
        Applies a JSON Patch document to the whole roles collection at once — JSON-pointer paths are rooted at a role name, e.g. `/my_role/description` or `/my_role` itself to add/remove an entire role. Only `add`, `replace`, and `remove` operations are supported; `move`, `copy`, and `test` are rejected with 400. If the resulting diff is empty, the request still succeeds with `"No updates required"`.
      operationId: patchRoles
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/JsonPatchOperation'
            example:
              - op: replace
                path: /my_role/description
                value: "Updated description"
      responses:
        '200':
          description: Roles patched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "OK"
                message: "Resource updated."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /_plugins/_security/api/roles/{role_name}:
    get:
      tags:
        - Roles
      summary: Get role
      description: Returns a single role by name. Returns 404 if the role doesn't exist, or is hidden and the caller isn't a REST API admin.
      operationId: getRole
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: role_name
          in: path
          required: true
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success. A single-key object, keyed by the role name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/Role'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Roles
      summary: Create or replace role
      description: |
        Fully replaces a role, or creates it if `role_name` doesn't exist yet. `reserved` and `hidden` are accepted only from a REST API admin caller — a non-admin submitting either gets a 400 invalid-key error. `static` can never be set through this API. Modifying a `static` or `reserved` role as a non-admin fails with 403.
      operationId: createOrUpdateRole
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: role_name
          in: path
          required: true
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Role'
            example:
              description: "Read-only access to wazuh-alerts indices"
              cluster_permissions:
                - "cluster_composite_ops_ro"
              index_permissions:
                - index_patterns: ["wazuh-alerts-*"]
                  allowed_actions: ["read"]
      responses:
        '200':
          description: Role updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "OK"
                message: "'my_role' updated."
        '201':
          description: Role created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "CREATED"
                message: "'my_role' created."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags:
        - Roles
      summary: Delete role
      description: Deletes a role by name. Returns 404 if it doesn't exist, 403 if it's `reserved`/`static` and the caller isn't a REST API admin.
      operationId: deleteRole
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: role_name
          in: path
          required: true
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Role deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "OK"
                message: "'my_role' deleted."
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Roles
      summary: Patch role
      description: |
        Applies a JSON Patch document to just this one role — paths are relative to the role itself, e.g. `/description` or `/index_permissions/0/allowed_actions/-`. Only `add`, `replace`, and `remove` operations are supported. The role must already exist (this cannot create a new one — use the bulk `PATCH /roles` for that).
      operationId: patchRole
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: role_name
          in: path
          required: true
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/JsonPatchOperation'
            example:
              - op: replace
                path: /description
                value: "Updated description"
      responses:
        '200':
          description: Role patched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "OK"
                message: "'my_role' updated."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /_plugins/_security/api/rolesmapping:
    get:
      tags:
        - Role mappings
      summary: List role mappings
      description: Returns every role mapping, keyed by role name.
      operationId: listRoleMappings
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/RoleMapping'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags:
        - Role mappings
      summary: Patch role mappings (bulk)
      description: |
        Applies a JSON Patch document to the whole role-mappings collection — paths are rooted at a role name, e.g. `/my_role/backend_roles`. Only `add`, `replace`, and `remove` operations are supported.
      operationId: patchRoleMappings
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/JsonPatchOperation'
      responses:
        '200':
          description: Role mappings patched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "OK"
                message: "Resource updated."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /_plugins/_security/api/rolesmapping/{role_name}:
    get:
      tags:
        - Role mappings
      summary: Get role mapping
      description: Returns a single role mapping by role name. Returns 404 if it doesn't exist.
      operationId: getRoleMapping
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: role_name
          in: path
          required: true
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success. A single-key object, keyed by the role name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/RoleMapping'
              example:
                wazuh_admin:
                  reserved: false
                  hidden: false
                  backend_roles: ["admin"]
                  users: ["wazuh-admin"]
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Role mappings
      summary: Create or replace role mapping
      description: |
        Fully replaces the mapping for `role_name`, or creates it if absent. At least one of `hosts`, `users`, `backend_roles`, or `and_backend_roles` must be present. `and_backend_roles` ANDs against `backend_roles` rather than ORing.
      operationId: createOrUpdateRoleMapping
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: role_name
          in: path
          required: true
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleMapping'
            example:
              backend_roles: ["soc_analyst"]
      responses:
        '200':
          description: Role mapping updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "OK"
                message: "'my_role' updated."
        '201':
          description: Role mapping created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "CREATED"
                message: "'my_role' created."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags:
        - Role mappings
      summary: Delete role mapping
      description: Deletes the mapping for `role_name`. Returns 404 if it doesn't exist.
      operationId: deleteRoleMapping
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: role_name
          in: path
          required: true
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Role mapping deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "OK"
                message: "'my_role' deleted."
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Role mappings
      summary: Patch role mapping
      description: Applies a JSON Patch document to this one role mapping — paths are relative to it, e.g. `/backend_roles/-`. The mapping must already exist.
      operationId: patchRoleMapping
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: role_name
          in: path
          required: true
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/JsonPatchOperation'
      responses:
        '200':
          description: Role mapping patched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "OK"
                message: "'my_role' updated."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /_plugins/_security/api/internalusers:
    get:
      tags:
        - Internal users
      summary: List internal users
      description: |
        Returns every internal user, keyed by username. `hash` is always an empty string in this response — the real password hash is never exposed through the API.
      operationId: listInternalUsers
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/InternalUser'
              example:
                wazuh-admin:
                  hash: ""
                  reserved: true
                  hidden: false
                  backend_roles: []
                  attributes: {}
                  opendistro_security_roles: []
                  description: "Wazuh administrator user"
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags:
        - Internal users
      summary: Patch internal users (bulk)
      description: |
        Applies a JSON Patch document to the whole internal-users collection — paths are rooted at a username, e.g. `/newuser` with `op: add` to create a user this way. Only `add`, `replace`, and `remove` operations are supported.
      operationId: patchInternalUsers
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/JsonPatchOperation'
      responses:
        '200':
          description: Internal users patched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "OK"
                message: "Resource updated."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /_plugins/_security/api/internalusers/{username}:
    get:
      tags:
        - Internal users
      summary: Get internal user
      description: Returns a single internal user by username. Returns 404 if it doesn't exist.
      operationId: getInternalUser
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success. A single-key object, keyed by username.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: '#/components/schemas/InternalUser'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Internal users
      summary: Create or replace internal user
      description: |
        Fully replaces `username`, or creates it if absent. Provide either `password` (plain text — the server hashes it, using the cluster's configured `plugins.security.password.hashing.algorithm`, bcrypt by default) or a pre-computed `hash` directly; `password` wins if both are present. Creating a new user requires one of the two; updating an existing one doesn't (the stored hash is kept if neither is supplied). `reserved`/`hidden` are accepted only from a REST API admin caller.
      operationId: createOrUpdateInternalUser
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalUser'
            example:
              password: "Cha4nGeMe!123"
              backend_roles: ["soc_analyst"]
              description: "SOC analyst account"
      responses:
        '200':
          description: Internal user updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "OK"
                message: "'jdoe' updated."
        '201':
          description: Internal user created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "CREATED"
                message: "'jdoe' created."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags:
        - Internal users
      summary: Delete internal user
      description: Deletes an internal user by username. Returns 404 if it doesn't exist, 403 if it's `reserved`/`static` and the caller isn't a REST API admin.
      operationId: deleteInternalUser
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Internal user deleted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "OK"
                message: "'jdoe' deleted."
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Internal users
      summary: Patch internal user
      description: Applies a JSON Patch document to this one internal user — paths are relative to it, e.g. `/backend_roles/-`. The user must already exist.
      operationId: patchInternalUser
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/JsonPatchOperation'
      responses:
        '200':
          description: Internal user patched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "OK"
                message: "'jdoe' updated."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /_plugins/_security/api/internalusers/{username}/authtoken:
    post:
      tags:
        - Internal users
      summary: Generate service account auth token
      description: |
        Generates a new Basic-Auth credential for a **service account** (an internal user whose `attributes` include `service: "true"` and `enabled: "true"`) and returns it embedded in the response `message`. This is not a JWT or bearer token — calling this endpoint **regenerates the account's password**, invalidating any prior credential, and the returned string is `Basic <base64(username:new_password)>`. No request body. Fails with 400 for any account that isn't a service account.
      operationId: generateInternalUserAuthToken
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: username
          in: path
          required: true
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Auth token generated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "OK"
                message: "'my_service_account' authtoken generated Basic bXlfc2VydmljZV9hY2NvdW50Om5ldy1yYW5kb20tcGFzc3dvcmQ="
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /_plugins/_security/api/account:
    get:
      tags:
        - Account
      summary: Get own account
      description: Returns account details for the caller's own authenticated user.
      operationId: getAccount
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'

    put:
      tags:
        - Account
      summary: Change own password
      description: |
        Changes the password for the caller's own account. `current_password` is always required and is verified against the stored hash. Provide either `password` (plain text, subject to the cluster's password-strength settings) or a pre-computed `hash`. If the caller's own account is `reserved` (e.g. the built-in `admin` user) and the caller isn't a REST API admin, this fails with 403 — reserved accounts can't self-service their password through this endpoint.
      operationId: updateAccountPassword
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
            example:
              current_password: "OldPassword!1"
              password: "NewPassword!2"
      responses:
        '200':
          description: Password updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "OK"
                message: "'jdoe' updated."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /_plugins/_security/api/permissionsinfo:
    get:
      tags:
        - Permissions info
      summary: Get evaluated REST API permissions
      description: Returns whether the caller has REST API access at all, and which HTTP methods are disabled per endpoint for the caller's current roles.
      operationId: getPermissionsInfo
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsInfoResponse'
              example:
                user: "User [name=jdoe, backend_roles=[soc_analyst], ...]"
                user_name: "jdoe"
                has_api_access: true
                disabled_endpoints:
                  ROLES: ["PUT", "DELETE", "PATCH"]
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '500':
          description: 'Internal Server Error - the permissions check itself failed unexpectedly. Uses a distinct `{"error": "..."}` envelope, not the standard `status`/`message` shape.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /_plugins/_security/api/_upgrade_check:
    get:
      tags:
        - Config upgrade
      summary: Check for pending config upgrade
      description: |
        Compares the currently-active `roles` configuration against the plugin's bundled default `roles.yml` and reports what would change. As of this version, `roles` is the only configuration type this endpoint supports. Body-less — driven entirely by query parameters.
      operationId: checkConfigUpgrade
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: configs
          in: query
          description: Configuration types to check. Only `roles` is currently supported. Defaults to `roles` if omitted.
          schema:
            type: array
            items:
              type: string
              enum: [roles]
        - name: entities
          in: query
          description: Specific entity (role) names to check. Defaults to all (`*`) if omitted.
          schema:
            type: array
            items:
              type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success. `upgradeActions` is present only when `upgradeAvailable` is `true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigUpgradeCheckResponse'
              example:
                status: "OK"
                upgradeAvailable: true
                upgradeActions:
                  roles:
                    add: ["new_default_role"]
                    remove: []
                    modify: ["all_access"]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /_plugins/_security/api/_upgrade_perform:
    post:
      tags:
        - Config upgrade
      summary: Perform config upgrade
      description: |
        Applies the same diff computed by `GET /_upgrade_check` — recomputes it, then patches the live configuration. Unlike ordinary `PUT`/`PATCH`/`DELETE` on `/roles`, this is explicitly allowed to modify `reserved`/`hidden` roles, since it's meant to refresh Wazuh/OpenSearch's own built-in defaults after an upgrade. Fails with 400 if there's nothing to upgrade. Body-less — driven entirely by query parameters, same as `_upgrade_check`.
      operationId: performConfigUpgrade
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: configs
          in: query
          description: Configuration types to upgrade. Only `roles` is currently supported. Defaults to `roles` if omitted.
          schema:
            type: array
            items:
              type: string
              enum: [roles]
        - name: entities
          in: query
          description: Specific entity (role) names to upgrade. Defaults to all (`*`) if omitted.
          schema:
            type: array
            items:
              type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigUpgradePerformResponse'
              example:
                status: "OK"
                upgrades:
                  roles:
                    add: ["new_default_role"]
                    remove: []
                    modify: ["all_access"]
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /_plugins/_security/api/securityconfig:
    get:
      tags:
        - Security config
      summary: Get security configuration
      description: |
        Returns the cluster's global security configuration document (authentication/authorization domains, anonymous-auth, multi-tenancy, and other dynamic settings). The stored document also carries a `_meta` block, but it's stripped from this response.
      operationId: getSecurityConfig
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityConfigGetResponse'
              example:
                config:
                  dynamic:
                    http:
                      anonymous_auth_enabled: false
                      xff:
                        enabled: false
                    authc:
                      basic_internal_auth_domain:
                        description: "Authenticate via HTTP Basic against internal users database"
                        http_enabled: true
                        order: 4
                        http_authenticator:
                          type: "basic"
                          challenge: true
                        authentication_backend:
                          type: "intern"
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    patch:
      tags:
        - Security config
      summary: Patch security configuration
      description: |
        Applies a JSON Patch document to the full stored document (including `_meta`), e.g. path `/config/dynamic/http/anonymous_auth_enabled`. In practice, only patches that leave `config` containing solely a `dynamic` key are accepted — a patch targeting `/_meta/...` is rejected, since `_meta` isn't in this endpoint's allowed-keys set. Requires either the cluster setting `plugins.security.unsupported.restapi.allow_securityconfig_modification: true`, or a REST API admin caller — otherwise every write to this endpoint fails with 403 regardless of the caller's role permissions.
      operationId: patchSecurityConfig
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/JsonPatchOperation'
            example:
              - op: replace
                path: /config/dynamic/http/anonymous_auth_enabled
                value: true
      responses:
        '200':
          description: Security configuration patched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "OK"
                message: "Resource updated."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /_plugins/_security/api/securityconfig/config:
    put:
      tags:
        - Security config
      summary: Replace security configuration
      description: |
        Wholesale-replaces the security configuration. The trailing `config` path segment is fixed and not repeated in the body: the request must be exactly `{"dynamic": {...}}` — no outer `config` wrapper key and no `_meta`. Requires either the cluster setting `plugins.security.unsupported.restapi.allow_securityconfig_modification: true`, or a REST API admin caller — otherwise this fails with 403 regardless of the caller's role permissions.
      operationId: replaceSecurityConfig
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecurityConfigPutRequest'
      responses:
        '200':
          description: Security configuration replaced successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusMessageResponse'
              example:
                status: "OK"
                message: "'config' updated."
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

