        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  schemas:
    JsonPatchOperation:
      type: object
      description: One RFC 6902 JSON Patch operation. Only `add`, `replace`, and `remove` are accepted by this API — `move`, `copy`, and `test` are rejected with 400.
      required:
        - op
        - path
      properties:
        op:
          type: string
          enum: [add, replace, remove]
        path:
          type: string
          description: RFC 6901 JSON Pointer.
        value:
          description: Required for `add`/`replace`. Omitted for `remove`.

    StatusMessageResponse:
      type: object
      description: The standard response envelope this API uses for mutation results and most non-validation errors.
      required:
        - status
        - message
      properties:
        status:
          type: string
          description: The literal `RestStatus` enum name, e.g. `OK`, `CREATED`, `NOT_FOUND`, `FORBIDDEN`, `BAD_REQUEST`, `CONFLICT`.
        message:
          type: string

    ValidationErrorResponse:
      type: object
      description: |
        Returned when a `PUT`/`PATCH` request body fails field-level content validation (unknown/disallowed keys, wrong data type, a missing mandatory-OR key, or malformed field syntax). Distinct from `StatusMessageResponse` — note the lowercase literal `status: "error"` rather than an uppercase `RestStatus` name.
      required:
        - status
        - reason
      properties:
        status:
          type: string
          enum: [error]
        reason:
          type: string
      additionalProperties: true

    Role:
      type: object
      properties:
        cluster_permissions:
          type: array
          items:
            type: string
          default: []
          description: Cluster-level action names or action-group names, e.g. `cluster_monitor`.
        index_permissions:
          type: array
          items:
            $ref: '#/components/schemas/RoleIndexPermission'
          default: []
        tenant_permissions:
          type: array
          items:
            $ref: '#/components/schemas/RoleTenantPermission'
          default: []
        description:
          type: string
        reserved:
          type: boolean
          default: false
          description: Settable only by a REST API admin caller. A non-admin submitting this key gets a 400 invalid-key error.
        hidden:
          type: boolean
          default: false
          description: Same admin-only write restriction as `reserved`.
        static:
          type: boolean
          readOnly: true
          description: Never settable through the API — populated only from the plugin's bundled static role definitions.

    RoleIndexPermission:
      type: object
      properties:
        index_patterns:
          type: array
          items:
            type: string
          description: Supports wildcards and `${user_name}` substitution.
        dls:
          type: string
          nullable: true
          description: A document-level-security query, serialized as a JSON-encoded string (not a nested object) — e.g. `"{\"term\":{\"type\":\"a\"}}"`.
        fls:
          type: array
          items:
            type: string
          description: Field-level security. A field prefixed with `~` or `!` is excluded (blocklist); a bare field name is an allowlist entry.
        masked_fields:
          type: array
          items:
            type: string
          description: |
            Field masking, `::`-delimited: `field` (cluster-default hash algorithm), `field::algorithm` (a specific `java.security.MessageDigest` algorithm, e.g. `SHA-512`), or `field::/regex/::replacement` (one or more chained regex replacements).
        allowed_actions:
          type: array
          items:
            type: string
          description: e.g. `read`, `crud`, `indices_all`, `"*"`.

    RoleTenantPermission:
      type: object
      properties:
        tenant_patterns:
          type: array
          items:
            type: string
        allowed_actions:
          type: array
          items:
            type: string
          description: e.g. `kibana_all_write`.

    RoleMapping:
      type: object
      description: At least one of `hosts`, `users`, `backend_roles`, or `and_backend_roles` must be present.
      properties:
        hosts:
          type: array
          items:
            type: string
        users:
          type: array
          items:
            type: string
        backend_roles:
          type: array
          items:
            type: string
        and_backend_roles:
          type: array
          items:
            type: string
          description: ANDs against `backend_roles` rather than ORing.
        description:
          type: string
        reserved:
          type: boolean
          default: false
          description: Settable only by a REST API admin caller.
        hidden:
          type: boolean
          default: false
          description: Same admin-only write restriction as `reserved`.

    InternalUser:
      type: object
      properties:
        hash:
          type: string
          description: Always an empty string in GET responses — the real hash is never exposed. On write, produced by the cluster's configured password hashing algorithm (bcrypt by default) if `password` is supplied instead.
        password:
          type: string
          writeOnly: true
          description: Plain-text password. Takes precedence over `hash` if both are supplied. Required (as either this or `hash`) when creating a new user; optional when updating an existing one.
        backend_roles:
          type: array
          items:
            type: string
          default: []
        attributes:
          type: object
          additionalProperties:
            type: string
          default: {}
          description: Arbitrary key-value metadata, e.g. used for `attribute.internal.<key>` substitution in DLS queries.
        opendistro_security_roles:
          type: array
          items:
            type: string
          default: []
          description: Roles assigned directly to this user, independent of `backend_roles` + role mapping.
        description:
          type: string
        reserved:
          type: boolean
          default: false
          description: Settable only by a REST API admin caller.
        hidden:
          type: boolean
          default: false
          description: Same admin-only write restriction as `reserved`.
        static:
          type: boolean
          readOnly: true
          description: Never settable through the API — populated only from bundled static user definitions.

    AccountResponse:
      type: object
      properties:
        user_name:
          type: string
        is_reserved:
          type: boolean
        is_hidden:
          type: boolean
        is_internal_user:
          type: boolean
          description: False if the caller authenticated via a non-internal backend (LDAP, SAML, etc.) with no matching internal-user document.
        user_requested_tenant:
          type: string
          nullable: true
        backend_roles:
          type: array
          items:
            type: string
        custom_attribute_names:
          type: array
          items:
            type: string
        tenants:
          type: object
          additionalProperties:
            type: boolean
          description: Map of tenant name to whether the caller has access to it.
        roles:
          type: array
          items:
            type: string
          description: The caller's evaluated/mapped security roles.

    UpdateAccountRequest:
      type: object
      required:
        - current_password
      properties:
        current_password:
          type: string
        password:
          type: string
          description: Plain-text new password, subject to the cluster's `plugins.security.restapi.password_*` strength settings. Takes precedence over `hash` if both are supplied. One of `password`/`hash` is required.
        hash:
          type: string
          description: Pre-computed password hash. One of `password`/`hash` is required.

    PermissionsInfoResponse:
      type: object
      properties:
        user:
          type: string
          description: A verbose internal debug representation of the caller (not just the username).
        user_name:
          type: string
          nullable: true
        has_api_access:
          type: boolean
        disabled_endpoints:
          type: object
          description: Maps a Security API endpoint name to the HTTP methods disabled for the caller on it.
          additionalProperties:
            type: array
            items:
              type: string

    ConfigUpgradeCheckResponse:
      type: object
      required:
        - status
        - upgradeAvailable
      properties:
        status:
          type: string
        upgradeAvailable:
          type: boolean
        upgradeActions:
          type: object
          description: Present only when `upgradeAvailable` is `true`.
          additionalProperties:
            $ref: '#/components/schemas/ConfigUpgradeDiff'

    ConfigUpgradePerformResponse:
      type: object
      required:
        - status
        - upgrades
      properties:
        status:
          type: string
        upgrades:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ConfigUpgradeDiff'

    ConfigUpgradeDiff:
      type: object
      properties:
        add:
          type: array
          items:
            type: string
        remove:
          type: array
          items:
            type: string
        modify:
          type: array
          items:
            type: string

    SecurityConfigGetResponse:
      type: object
      properties:
        config:
          type: object
          properties:
            dynamic:
              $ref: '#/components/schemas/SecurityConfigDynamic'

    SecurityConfigPutRequest:
      type: object
      description: No outer `config` wrapper and no `_meta` — the body is exactly the contents that would sit under `config.dynamic` elsewhere.
      required:
        - dynamic
      properties:
        dynamic:
          $ref: '#/components/schemas/SecurityConfigDynamic'

    SecurityConfigDynamic:
      type: object
      properties:
        filtered_alias_mode:
          type: string
          enum: [warn, nowarn, disallow]
          default: warn
        disable_rest_auth:
          type: boolean
          default: false
        disable_intertransport_auth:
          type: boolean
          default: false
        respect_request_indices_options:
          type: boolean
          default: false
        license:
          type: string
          nullable: true
        kibana:
          $ref: '#/components/schemas/SecurityConfigKibana'
        http:
          $ref: '#/components/schemas/SecurityConfigHttp'
        authc:
          type: object
          description: Map of authentication-domain name (chosen by the administrator) to its settings.
          additionalProperties:
            $ref: '#/components/schemas/AuthcDomain'
        authz:
          type: object
          description: Map of authorization-domain name to its settings.
          additionalProperties:
            $ref: '#/components/schemas/AuthzDomain'
        auth_failure_listeners:
          type: object
          description: Map of listener name to its rate-limiting settings.
          additionalProperties:
            $ref: '#/components/schemas/AuthFailureListener'
        do_not_fail_on_forbidden:
          type: boolean
          default: false
        multi_rolespan_enabled:
          type: boolean
          default: true
        hosts_resolver_mode:
          type: string
          default: ip-only
        transport_userrname_attribute:
          type: string
          nullable: true
          description: This exact spelling (`userrname`, not `username`) is how the field is literally named in the plugin's own source.
        do_not_fail_on_forbidden_empty:
          type: boolean
          default: false
        on_behalf_of:
          $ref: '#/components/schemas/OnBehalfOfSettings'

    AuthcDomain:
      type: object
      properties:
        http_enabled:
          type: boolean
          default: true
        order:
          type: integer
          default: 0
          description: Lower values are evaluated first.
        http_authenticator:
          $ref: '#/components/schemas/HttpAuthenticator'
        authentication_backend:
          $ref: '#/components/schemas/AuthenticationBackend'
        description:
          type: string
        transport_enabled:
          type: boolean
          deprecated: true
          description: Accepted for backward compatibility but has no runtime effect — silently ignored.

    AuthzDomain:
      type: object
      properties:
        http_enabled:
          type: boolean
          default: true
        authorization_backend:
          $ref: '#/components/schemas/AuthorizationBackend'
        description:
          type: string
        transport_enabled:
          type: boolean
          deprecated: true
          description: Accepted for backward compatibility but has no runtime effect — silently ignored.

    HttpAuthenticator:
      type: object
      properties:
        type:
          type: string
          description: |
            A built-in short name — `basic`, `proxy`, `extended-proxy`, `clientcert`, `kerberos`, `jwt`, `openid`, `saml` — or a fully-qualified custom authenticator class name.
        challenge:
          type: boolean
          default: true
        config:
          type: object
          description: Shape depends entirely on `type` — modeled as free-form.
          additionalProperties: true

    AuthenticationBackend:
      type: object
      properties:
        type:
          type: string
          default: intern
          description: |
            A built-in short name — `intern`/`internal` (the internal user database), `noop`, `ldap`, `ldap2` — or a fully-qualified custom backend class name.
        config:
          type: object
          description: Shape depends entirely on `type` (e.g. an LDAP backend takes ~15 LDAP-specific keys here) — modeled as free-form.
          additionalProperties: true

    AuthorizationBackend:
      type: object
      properties:
        type:
          type: string
          default: noop
          description: |
            A built-in short name — `noop`, `intern`/`internal` (also resolves to a no-op for authorization), `ldap`, `ldap2` — or a fully-qualified custom backend class name.
        config:
          type: object
          description: Shape depends entirely on `type` — modeled as free-form.
          additionalProperties: true

    SecurityConfigHttp:
      type: object
      properties:
        anonymous_auth_enabled:
          type: boolean
          default: false
        xff:
          $ref: '#/components/schemas/Xff'

    Xff:
      type: object
      description: X-Forwarded-For settings. Note the camelCase field names below — they are literal, not a documentation typo.
      properties:
        enabled:
          type: boolean
          default: false
        internalProxies:
          type: string
          description: A regex matching trusted proxy IPs. Defaults to the standard RFC 1918 private-address ranges.
        remoteIpHeader:
          type: string
          default: X-Forwarded-For

    SecurityConfigKibana:
      type: object
      description: Dashboard/multi-tenancy settings. Note the JSON key is literally `kibana`, not `dashboard`.
      properties:
        multitenancy_enabled:
          type: boolean
          default: true
        private_tenant_enabled:
          type: boolean
          default: true
        default_tenant:
          type: string
          default: ""
        server_username:
          type: string
          default: kibanaserver
        opendistro_role:
          type: string
          nullable: true
        index:
          type: string
          default: .kibana
        sign_in_options:
          type: array
          items:
            type: string
            enum: [BASIC, SAML, OPENID, ANONYMOUS]
          default: [BASIC]

    AuthFailureListener:
      type: object
      properties:
        type:
          type: string
          enum: [ip, username]
        authentication_backend:
          type: string
          nullable: true
          description: Only used for `username`-type listeners.
        ignore_hosts:
          type: array
          items:
            type: string
        allowed_tries:
          type: integer
          default: 10
        time_window_seconds:
          type: integer
          default: 3600
        block_expiry_seconds:
          type: integer
          default: 600
        max_blocked_clients:
          type: integer
          default: 100000
        max_tracked_clients:
          type: integer
          default: 100000

    OnBehalfOfSettings:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
        signing_key:
          type: string
          nullable: true
        encryption_key:
          type: string
          nullable: true

    ActionGroup:
      type: object
      required:
        - allowed_actions
      properties:
        allowed_actions:
          type: array
          items:
            type: string
          description: Raw permission strings or the names of other action groups (nested reference; a group can't reference itself).
        type:
          type: string
          description: |
            On write, only `cluster` or `index` are accepted (omitting `type` is allowed, but deprecated). Existing stock groups may also show `kibana` or `all`, which aren't accepted on write.
          enum: [cluster, index]
        description:
          type: string
        reserved:
          type: boolean
          default: false
          description: Settable only by a REST API admin caller.
        hidden:
          type: boolean
          default: false
          description: Same admin-only write restriction as `reserved`.
        static:
          type: boolean
          readOnly: true
          description: Never settable through the API — populated only from bundled static action-group definitions.

    Tenant:
      type: object
      properties:
        description:
          type: string
        reserved:
          type: boolean
          default: false
          description: Settable only by a REST API admin caller.
        hidden:
          type: boolean
          default: false
          description: Same admin-only write restriction as `reserved`.
        static:
          type: boolean
          readOnly: true
          description: Never settable through the API — populated only from bundled static tenant definitions.

    MultiTenancyConfig:
      type: object
      properties:
        multitenancy_enabled:
          type: boolean
          default: true
        private_tenant_enabled:
          type: boolean
          default: true
        default_tenant:
          type: string
          default: ""
          description: '`""`, `global`, `private`, or the name of an existing tenant.'
        sign_in_options:
          type: array
          items:
            type: string
            enum: [BASIC, SAML, OPENID, ANONYMOUS]
          default: [BASIC]

  responses:
    BadRequest:
      description: Bad Request - the request body failed content validation (invalid/missing keys, wrong data type, or a business-rule violation), or a JSON Patch request used an unsupported operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            status: "error"
            reason: "Invalid configuration"
            invalid_keys:
              keys: "reserved"

    Forbidden:
      description: Forbidden - the caller lacks permission for this action, or the target resource is `reserved`/`static` and the caller isn't a REST API admin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusMessageResponse'
          example:
            status: "FORBIDDEN"
            message: "Resource 'my_role' is reserved."

    NotFound:
      description: Not Found - the requested name doesn't exist, or it's `hidden` and the caller isn't a REST API admin.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusMessageResponse'
          example:
            status: "NOT_FOUND"
            message: "role 'my_role' not found."
