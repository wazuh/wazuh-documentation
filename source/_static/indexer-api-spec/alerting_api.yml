components:
  schemas:
    Schedule:
      type: object
      description: Exactly one of `period` or `cron` must be provided.
      properties:
        period:
          type: object
          properties:
            interval:
              type: integer
            unit:
              type: string
              enum: [SECONDS, MINUTES, HOURS, DAYS]
        cron:
          type: object
          properties:
            expression:
              type: string
            timezone:
              type: string

    MonitorRequest:
      type: object
      required:
        - name
        - schedule
        - inputs
        - triggers
      properties:
        name:
          type: string
        monitor_type:
          type: string
          description: |
            One of `query_level_monitor`, `bucket_level_monitor`, `cluster_metrics_monitor`, `doc_level_monitor`, or the Wazuh-only `active_response_monitor`. `active_response_monitor` requires its input indices to be prefixed `wazuh-findings-v5` and an interval schedule of 60 seconds or less.
          default: "query_level_monitor"
        enabled:
          type: boolean
          default: true
        schedule:
          $ref: '#/components/schemas/Schedule'
        inputs:
          type: array
          description: Search, document-level, cluster-metrics, or remote-monitor inputs, keyed by input type.
          items:
            type: object
        triggers:
          type: array
          description: Trigger type must match the monitor type, e.g. `query_level_trigger` for a `query_level_monitor`.
          items:
            type: object
        ui_metadata:
          type: object
        schema_version:
          type: integer
        data_sources:
          type: object
          description: Custom values are rejected — only the system defaults are accepted at this time.
        delete_query_index_in_every_run:
          type: boolean
          default: false
        should_create_single_alert_for_findings:
          type: boolean
          default: false
        owner:
          type: string
          default: "alerting"
        rbac_roles:
          type: array
          items:
            type: string

    MonitorSummary:
      type: object
      properties:
        name:
          type: string
        monitor_type:
          type: string
        enabled:
          type: boolean
        schedule:
          $ref: '#/components/schemas/Schedule'
        inputs:
          type: array
          items:
            type: object
        triggers:
          type: array
          items:
            type: object
        owner:
          type: string
        schema_version:
          type: integer
        last_update_time:
          type: integer
          format: int64
        enabled_time:
          type: integer
          format: int64
          nullable: true

    IndexMonitorResponse:
      type: object
      properties:
        _id:
          type: string
        _version:
          type: integer
          format: int64
        _seq_no:
          type: integer
          format: int64
        _primary_term:
          type: integer
          format: int64
        monitor:
          $ref: '#/components/schemas/MonitorSummary'

    GetMonitorResponse:
      type: object
      properties:
        _id:
          type: string
        _version:
          type: integer
          format: int64
        _seq_no:
          type: integer
          format: int64
        _primary_term:
          type: integer
          format: int64
        monitor:
          $ref: '#/components/schemas/MonitorSummary'
        associated_workflows:
          type: array
          description: Workflows that reference this monitor as a delegate.
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string

    AlertDto:
      type: object
      properties:
        id:
          type: string
        version:
          type: integer
          format: int64
        schema_version:
          type: integer
        monitor_id:
          type: string
        workflow_id:
          type: string
        workflow_name:
          type: string
        associated_alert_ids:
          type: array
          items:
            type: string
        monitor_version:
          type: integer
          format: int64
        monitor_name:
          type: string
        execution_id:
          type: string
          nullable: true
        trigger_id:
          type: string
        trigger_name:
          type: string
        finding_ids:
          type: array
          items:
            type: string
        related_doc_ids:
          type: array
          items:
            type: string
        state:
          type: string
          enum: [ACTIVE, ACKNOWLEDGED, COMPLETED, ERROR, DELETED, AUDIT]
        error_message:
          type: string
          nullable: true
        alert_history:
          type: array
          items:
            type: object
        severity:
          type: string
        action_execution_results:
          type: array
          items:
            type: object
        start_time:
          type: string
          format: date-time
        last_notification_time:
          type: string
          format: date-time
          nullable: true
        end_time:
          type: string
          format: date-time
          nullable: true
        acknowledged_time:
          type: string
          format: date-time
          nullable: true
        clusters:
          type: array
          description: Only emitted if non-empty.
          items:
            type: string

    GetAlertsResponse:
      type: object
      properties:
        totalAlerts:
          type: integer
          nullable: true
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertDto'

    AcknowledgeAlertResponse:
      type: object
      properties:
        success:
          type: array
          description: Alert IDs successfully acknowledged.
          items:
            type: string
        failed:
          type: array
          description: |
            Alert IDs that could not be acknowledged (already processed, in an error state, or not found), each as a single-key object mapping the alert ID to a failure reason.
          items:
            type: object
            additionalProperties:
              type: object
              properties:
                failed_reason:
                  type: string

    MonitorRunResult:
      type: object
      properties:
        monitor_name:
          type: string
        period_start:
          type: integer
          format: int64
        period_end:
          type: integer
          format: int64
        error:
          type: string
          nullable: true
        input_results:
          type: object
          properties:
            results:
              type: array
              items:
                type: object
            error:
              type: string
              nullable: true
        trigger_results:
          type: object
          description: Keyed by trigger ID.
          additionalProperties:
            type: object
            properties:
              name:
                type: string
              triggered:
                type: boolean
              action_results:
                type: object
              error:
                type: string
                nullable: true

    WorkflowDelegate:
      type: object
      required:
        - order
        - monitor_id
      properties:
        order:
          type: integer
          description: Must be greater than 0 and unique within the sequence.
        monitor_id:
          type: string
        chained_monitor_findings:
          type: object
          description: References an earlier delegate (by a strictly smaller `order`) whose findings feed this monitor.
          properties:
            monitor_id:
              type: string
            monitor_ids:
              type: array
              items:
                type: string

    ChainedAlertTrigger:
      type: object
      required:
        - name
        - severity
        - condition
        - actions
      properties:
        id:
          type: string
          readOnly: true
        name:
          type: string
        severity:
          type: string
        condition:
          type: object
          properties:
            script:
              type: object
              properties:
                source:
                  type: string
                lang:
                  type: string
                  enum: [painless]
        actions:
          type: array
          items:
            type: object

    WorkflowRequest:
      type: object
      required:
        - name
        - schedule
        - inputs
      properties:
        name:
          type: string
        workflow_type:
          type: string
          enum: [composite]
          default: "composite"
        enabled:
          type: boolean
          default: true
        schedule:
          $ref: '#/components/schemas/Schedule'
        inputs:
          type: array
          description: Exactly one `composite_input`, containing a sequence of up to 25 delegates.
          items:
            type: object
            properties:
              composite_input:
                type: object
                properties:
                  sequence:
                    type: object
                    properties:
                      delegates:
                        type: array
                        items:
                          $ref: '#/components/schemas/WorkflowDelegate'
        triggers:
          type: array
          description: Each element must be a `chained_alert_trigger`.
          items:
            type: object
            properties:
              chained_alert_trigger:
                $ref: '#/components/schemas/ChainedAlertTrigger'
        owner:
          type: string
          default: "alerting"
        audit_delegate_monitor_alerts:
          type: boolean
          default: true
        rbac_roles:
          type: array
          items:
            type: string

    WorkflowSummary:
      type: object
      properties:
        name:
          type: string
        workflow_type:
          type: string
        enabled:
          type: boolean
        owner:
          type: string
        audit_delegate_monitor_alerts:
          type: boolean

    IndexWorkflowResponse:
      type: object
      properties:
        _id:
          type: string
        _version:
          type: integer
          format: int64
        _seq_no:
          type: integer
          format: int64
        _primary_term:
          type: integer
          format: int64
        workflow:
          $ref: '#/components/schemas/WorkflowSummary'

    GetWorkflowResponse:
      type: object
      properties:
        _id:
          type: string
        _version:
          type: integer
          format: int64
        _seq_no:
          type: integer
          format: int64
        _primary_term:
          type: integer
          format: int64
        workflow:
          $ref: '#/components/schemas/WorkflowSummary'

    WorkflowRunResult:
      type: object
      properties:
        execution_id:
          type: string
        workflow_name:
          type: string
        workflow_id:
          type: string
        trigger_results:
          type: object
          description: Keyed by trigger ID.
          additionalProperties:
            type: object
            properties:
              name:
                type: string
              triggered:
                type: boolean
              action_results:
                type: object
              error:
                type: string
                nullable: true
        monitor_run_results:
          type: array
          items:
            $ref: '#/components/schemas/MonitorRunResult'
        execution_start_time:
          type: string
          format: date-time
        execution_end_time:
          type: string
          format: date-time
        error:
          type: string
          nullable: true

    GetWorkflowAlertsResponse:
      type: object
      properties:
        alerts:
          type: array
          items:
            $ref: '#/components/schemas/AlertDto'
        associatedAlerts:
          type: array
          description: Per-delegate-monitor alerts. Only populated if `getAssociatedAlerts=true`.
          items:
            $ref: '#/components/schemas/AlertDto'
        totalAlerts:
          type: integer
          nullable: true

    DocLevelQuery:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        fields:
          type: array
          items:
            type: string
        query:
          type: string
        tags:
          type: array
          items:
            type: string

    FindingDocument:
      type: object
      properties:
        index:
          type: string
        id:
          type: string
        found:
          type: boolean
        document:
          type: string
          description: The raw JSON source of the matched document, as a string.

    AlertingFinding:
      type: object
      properties:
        id:
          type: string
        related_doc_ids:
          type: array
          items:
            type: string
        correlated_doc_ids:
          type: array
          items:
            type: string
        monitor_id:
          type: string
        monitor_name:
          type: string
        index:
          type: string
        queries:
          type: array
          items:
            $ref: '#/components/schemas/DocLevelQuery'
        timestamp:
          type: integer
          format: int64
        execution_id:
          type: string
          nullable: true

    FindingWithDocs:
      type: object
      properties:
        finding:
          $ref: '#/components/schemas/AlertingFinding'
        document_list:
          type: array
          items:
            $ref: '#/components/schemas/FindingDocument'

    GetAlertingFindingsResponse:
      type: object
      properties:
        total_findings:
          type: integer
          nullable: true
        findings:
          type: array
          items:
            $ref: '#/components/schemas/FindingWithDocs'

    ClusterIndex:
      type: object
      properties:
        name:
          type: string
        health:
          type: string
          nullable: true
        mappings:
          type: object
          description: Empty unless `include_mappings=true`.

    ClusterIndexes:
      type: object
      properties:
        cluster:
          type: string
        health:
          type: string
          nullable: true
        hub_cluster:
          type: boolean
          description: True for the local/coordinating cluster.
        latency:
          type: integer
          format: int64
        indexes:
          type: object
          description: Keyed by index name.
          additionalProperties:
            $ref: '#/components/schemas/ClusterIndex'

    GetRemoteIndexesResponse:
      type: object
      description: Keyed dynamically by cluster name.
      additionalProperties:
        $ref: '#/components/schemas/ClusterIndexes'

    Comment:
      type: object
      properties:
        entity_id:
          type: string
        entity_type:
          type: string
          enum: [alert]
        content:
          type: string
        created_time:
          type: integer
          format: int64
        last_updated_time:
          type: integer
          format: int64
          nullable: true
        user:
          type: string
          nullable: true
          description: The username that created the comment.

    IndexCommentResponse:
      type: object
      properties:
        _id:
          type: string
        _seq_no:
          type: integer
          format: int64
        _primary_term:
          type: integer
          format: int64
        comment:
          $ref: '#/components/schemas/Comment'

    Destination:
      type: object
      description: The public shape omits the internal `user` field.
      properties:
        id:
          type: string
        type:
          type: string
          enum: [chime, slack, custom_webhook, email]
        name:
          type: string
        schema_version:
          type: integer
        seq_no:
          type: integer
        primary_term:
          type: integer
        last_update_time:
          type: integer
          format: int64
        chime:
          type: object
          properties:
            url:
              type: string
        slack:
          type: object
          properties:
            url:
              type: string
        custom_webhook:
          type: object
          properties:
            url:
              type: string
              nullable: true
            scheme:
              type: string
              nullable: true
            host:
              type: string
              nullable: true
            port:
              type: integer
            path:
              type: string
              nullable: true
            method:
              type: string
              nullable: true
            query_params:
              type: object
            header_params:
              type: object
            username:
              type: string
              nullable: true
            password:
              type: string
              nullable: true
        email:
          type: object
          properties:
            email_account_id:
              type: string
            recipients:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                    enum: [email, email_group]
                  email:
                    type: string
                  email_group_id:
                    type: string

    GetDestinationsResponse:
      type: object
      properties:
        totalDestinations:
          type: integer
          nullable: true
        destinations:
          type: array
          items:
            $ref: '#/components/schemas/Destination'

    EmailAccount:
      type: object
      required:
        - name
        - email
        - host
        - port
        - method
      properties:
        schema_version:
          type: integer
        name:
          type: string
          description: Must match `[A-Z0-9_]+` (used as a keystore namespace).
        email:
          type: string
        host:
          type: string
        port:
          type: integer
        method:
          type: string
          enum: [none, ssl, starttls]

    GetEmailAccountResponse:
      type: object
      properties:
        _id:
          type: string
        _version:
          type: integer
          format: int64
        _seq_no:
          type: integer
          format: int64
        _primary_term:
          type: integer
          format: int64
        email_account:
          $ref: '#/components/schemas/EmailAccount'

    EmailGroup:
      type: object
      required:
        - name
        - emails
      properties:
        schema_version:
          type: integer
        name:
          type: string
          description: Must match `[A-Z0-9_-]+`.
        emails:
          type: array
          items:
            type: object
            properties:
              email:
                type: string

    GetEmailGroupResponse:
      type: object
      properties:
        _id:
          type: string
        _version:
          type: integer
          format: int64
        _seq_no:
          type: integer
          format: int64
        _primary_term:
          type: integer
          format: int64
        email_group:
          $ref: '#/components/schemas/EmailGroup'

    ScheduledJobsStatsResponse:
      type: object
      properties:
        _nodes:
          type: object
          properties:
            total:
              type: integer
            successful:
              type: integer
            failed:
              type: integer
        cluster_name:
          type: string
        opendistro.scheduled_jobs.enabled:
          type: boolean
        plugins.scheduled_jobs.enabled:
          type: boolean
        scheduled_job_index_exists:
          type: boolean
        scheduled_job_index_status:
          type: string
          nullable: true
        nodes_on_schedule:
          type: integer
        nodes_not_on_schedule:
          type: integer
        nodes:
          type: object
          description: Keyed by node ID.
          additionalProperties:
            type: object
            properties:
              name:
                type: string
              schedule_status:
                type: string
                enum: [green, red]
              roles:
                type: array
                items:
                  type: string
              job_scheduling_metrics:
                type: object
                properties:
                  last_full_sweep_time_millis:
                    type: integer
                    format: int64
                  full_sweep_on_time:
                    type: boolean
              jobs_info:
                type: object
                description: Keyed by job/monitor ID.
                additionalProperties:
                  type: object
                  properties:
                    last_execution_time:
                      type: string
                      format: date-time
                    last_execution_time_in_millis:
                      type: integer
                      format: int64
                    running_on_time:
                      type: boolean

    ErrorEnvelope:
      type: object
      description: The standard OpenSearch error response envelope.
      properties:
        error:
          type: object
          properties:
            root_cause:
              type: array
              items:
                type: object
                properties:
                  type:
                    type: string
                  reason:
                    type: string
            type:
              type: string
            reason:
              type: string
        status:
          type: integer

  responses:
    BadRequest:
      description: Bad Request - the request body or parameters failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    Forbidden:
      description: Forbidden - the caller lacks permission for this action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              root_cause:
                - type: "security_exception"
                  reason: "User doesn't have permissions to execute this action. Contact administrator."
              type: "security_exception"
              reason: "User doesn't have permissions to execute this action. Contact administrator."
            status: 403

    NotFound:
      description: Not Found - the requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
