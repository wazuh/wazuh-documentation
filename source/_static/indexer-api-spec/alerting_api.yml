      summary: Get cluster-wide scheduled-job stats for specific metrics
      description: |
        Returns cluster-wide scheduled-job statistics, limited to one or more comma-separated metrics.
      operationId: getAlertingStatsForMetric
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: metric
          in: path
          required: true
          description: Comma-separated metric names, or `_all`.
          schema:
            type: string
            enum: [job_scheduling_metrics, jobs_info, _all]
          example: "jobs_info"
        - name: timeout
          in: query
