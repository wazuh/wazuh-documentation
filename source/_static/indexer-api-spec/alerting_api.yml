        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledJobsStatsResponse'
        '400':
          description: |
            Bad Request - an unrecognized metric name was given, or `_all` was combined with individual metric names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

