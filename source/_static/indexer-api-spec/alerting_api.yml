        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledJobsStatsResponse'
              example:
                _nodes:
                  total: 1
                  successful: 1
                  failed: 0
                cluster_name: "wazuh-cluster"
                opendistro.scheduled_jobs.enabled: true
                plugins.scheduled_jobs.enabled: true
                scheduled_job_index_exists: true
                scheduled_job_index_status: "green"
                nodes_on_schedule: 1
                nodes_not_on_schedule: 0
                nodes:
                  mZ9k2vQvT5S3f8jH1cRQAA:
                    name: "wazuh-indexer-node-1"
                    schedule_status: "green"
                    roles:
                      - "DATA"
                      - "INGEST"
                      - "CLUSTER_MANAGER"
                    job_scheduling_metrics:
                      last_full_sweep_time_millis: 1735689000000
                      full_sweep_on_time: true
                    jobs_info:
                      8fT2wXwB9tOWfnfv0lB2:
                        last_execution_time: "2025-01-01T00:05:00.000Z"
                        last_execution_time_in_millis: 1735689900000
                        running_on_time: true
