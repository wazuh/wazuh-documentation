      summary: Get a legacy email account
      description: |
        Returns a single legacy email account by ID. Read-only. Requires `email` to be present in `plugins.alerting.destination.allow_list` (included by default). Never returns the stored credentials.
      operationId: getEmailAccount
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: emailAccountID
          in: path
          required: true
          description: The unique identifier of the email account.
          schema:
            type: string
          example: "P7YmZ5wB_9876zyxABC"
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetEmailAccountResponse'
              example:
                _id: "P7YmZ5wB_9876zyxABC"
                _version: 1
                _seq_no: 0
                _primary_term: 1
                email_account:
                  schema_version: 4
                  name: "alertsMailbox"
                  email: "alerts@example.com"
                  host: "smtp.example.com"
                  port: 465
                  method: "ssl"
        '400':
          description: Bad Request - missing email account ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          description: Forbidden - the `email` destination type is not in the allow-list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not Found - no email account exists with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  root_cause:
                    - type: "status_exception"
                      reason: "Email Account not found."
                  type: "status_exception"
                  reason: "Email Account not found."
                status: 404

    head:
      tags:
        - Destinations
      summary: Check email account existence
      description: Checks whether a legacy email account exists, without returning its content.
      operationId: emailAccountExists
