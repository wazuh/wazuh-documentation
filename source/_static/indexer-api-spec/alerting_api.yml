paths:
  /_plugins/_alerting/monitors:
    post:
      tags:
        - Monitors
      summary: Create monitor
      description: |
        Creates a monitor. A monitor defines what to check (inputs), on what schedule, and which triggers fire alerts when conditions are met. Wazuh adds a fifth monitor type, `active_response_monitor`, on top of the four stock OpenSearch types. The cluster is limited to a maximum of 10 monitors (`plugins.alerting.monitor.max_monitors`).
      operationId: createMonitor
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: refresh
          in: query
          description: The refresh policy to apply after indexing the monitor.
          schema:
            type: string
            enum: [IMMEDIATE, WAIT_UNTIL, NONE]
            default: IMMEDIATE
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorRequest'
            example:
              name: "high-cpu-alerts-monitor"
              monitor_type: "query_level_monitor"
              enabled: true
              schedule:
                period:
                  interval: 5
                  unit: "MINUTES"
              inputs:
                - search:
                    indices:
                      - "wazuh-alerts-*"
                    query:
                      query:
                        match_all: {}
              triggers:
                - query_level_trigger:
                    name: "high-severity-trigger"
                    severity: "1"
                    condition:
                      script:
                        source: "return ctx.results[0].hits.total.value > 0"
                        lang: "painless"
                    actions: []
      responses:
        '201':
          description: Monitor created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexMonitorResponse'
              example:
                _id: "8x2kQoQBcE4TZ_1qm3aB"
                _version: 1
                _seq_no: 0
                _primary_term: 1
                monitor:
                  name: "high-cpu-alerts-monitor"
                  monitor_type: "query_level_monitor"
                  enabled: true
                  schedule:
                    period:
                      interval: 5
                      unit: "MINUTES"
                  inputs:
                    - search:
                        indices:
                          - "wazuh-alerts-*"
                        query:
                          query:
                            match_all: {}
                  triggers:
                    - query_level_trigger:
                        id: "5f5X8-1kR9uZbg=="
                        name: "high-severity-trigger"
                        severity: "1"
                        condition:
                          script:
                            source: "return ctx.results[0].hits.total.value > 0"
                            lang: "painless"
                        actions: []
                  owner: "alerting"
                  schema_version: 4
                  last_update_time: 1755172800000
                  enabled_time: 1755172800000
        '400':
          description: |
            Bad Request - invalid schedule/monitor type/trigger, a Wazuh-only `active_response_monitor` constraint was violated (indices not prefixed `wazuh-findings-v5`, schedule not an interval `<=` 60 seconds), a non-default `data_sources` value was supplied (custom data sources are rejected), or the 10-monitor limit would be exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  root_cause:
                    - type: "illegal_argument_exception"
                      reason: "This request would create more than the allowed monitors [10]."
                  type: "illegal_argument_exception"
                  reason: "This request would create more than the allowed monitors [10]."
                status: 400
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          description: Too Many Requests - the internal monitor-count lock could not be acquired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /_plugins/_alerting/monitors/{monitorID}:
    put:
      tags:
        - Monitors
      summary: Update monitor
      description: |
        Updates an existing monitor. The request body has the same shape as monitor creation.
      operationId: updateMonitor
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: monitorID
          in: path
          required: true
          description: The unique identifier of the monitor to update.
          schema:
            type: string
          example: "8x2kQoQBcE4TZ_1qm3aB"
        - name: if_seq_no
          in: query
          description: Only update if the monitor's current `_seq_no` matches.
          schema:
            type: integer
            format: int64
        - name: if_primary_term
          in: query
          description: Only update if the monitor's current `_primary_term` matches.
          schema:
            type: integer
            format: int64
        - name: refresh
          in: query
          description: The refresh policy to apply after indexing the monitor.
          schema:
            type: string
            enum: [IMMEDIATE, WAIT_UNTIL, NONE]
            default: IMMEDIATE
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorRequest'
      responses:
        '200':
          description: Monitor updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexMonitorResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    get:
      tags:
        - Monitors
      summary: Get monitor
      description: |
        Returns a single monitor by ID, along with the IDs and names of any workflows that reference it as a delegate.
      operationId: getMonitor
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: monitorID
          in: path
          required: true
          description: The unique identifier of the monitor.
          schema:
            type: string
          example: "8x2kQoQBcE4TZ_1qm3aB"
        - name: version
          in: query
          description: Returns the monitor document only if it matches this document version.
          schema:
            type: integer
            format: int64
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetMonitorResponse'
              example:
                _id: "8x2kQoQBcE4TZ_1qm3aB"
                _version: 1
                _seq_no: 0
                _primary_term: 1
                monitor:
                  name: "high-cpu-alerts-monitor"
                  monitor_type: "query_level_monitor"
                  enabled: true
                associated_workflows:
                  - id: "wf_9a1c2b3d4e5f"
                    name: "Suspicious login chained workflow"
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not Found - no monitor exists with the given ID, or its backing index is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  root_cause:
                    - type: "status_exception"
                      reason: "Monitor not found."
                  type: "status_exception"
                  reason: "Monitor not found."
                status: 404

    head:
      tags:
        - Monitors
      summary: Check monitor existence
      description: |
        Checks whether a monitor exists, without returning its content. Uses the same handler as `GET`, with the document source suppressed.
      operationId: monitorExists
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: monitorID
          in: path
          required: true
          description: The unique identifier of the monitor.
          schema:
            type: string
          example: "8x2kQoQBcE4TZ_1qm3aB"
      responses:
        '200':
          description: The monitor exists. No response body.
        '404':
          description: No monitor exists with the given ID. No response body.

    delete:
      tags:
        - Monitors
      summary: Delete monitor
      description: |
        Deletes a monitor by ID. On success, all the monitor's alerts transition to the `DELETED` state and move into the alert history index; if that move fails, the monitor is not deleted. A monitor that is a delegate of a workflow cannot be deleted directly.
      operationId: deleteMonitor
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: monitorID
          in: path
          required: true
          description: The unique identifier of the monitor to delete.
          schema:
            type: string
          example: "8x2kQoQBcE4TZ_1qm3aB"
        - name: refresh
          in: query
          description: The refresh policy to apply after deleting the monitor.
          schema:
            type: string
            enum: [IMMEDIATE, WAIT_UNTIL, NONE]
            default: IMMEDIATE
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Monitor deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                  _version:
                    type: integer
                    format: int64
              example:
                _id: "8x2kQoQBcE4TZ_1qm3aB"
                _version: 2
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          description: |
            Forbidden - the monitor is a delegate of one or more workflows and can't be deleted directly, or the caller isn't allowed to delete it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  root_cause:
                    - type: "status_exception"
                      reason: "Monitor can't be deleted because it is a part of workflow(s)"
                  type: "status_exception"
                  reason: "Monitor can't be deleted because it is a part of workflow(s)"
                status: 403
        '404':
          $ref: '#/components/responses/NotFound'

  /_plugins/_alerting/monitors/_search:
    get:
      tags:
        - Monitors
      summary: Search monitors
      description: |
        Searches monitors using a standard OpenSearch query DSL body. The `index` parameter accepts only the scheduled-jobs index or the alerts index pattern.
      operationId: searchMonitors
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: index
          in: query
          description: The index to search. Defaults to the internal scheduled-jobs index.
          schema:
            type: string
            default: ".opensearch-scheduled-jobs"
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A standard OpenSearch query DSL object.
            example:
              query:
                match_all: {}
      responses:
        '200':
          description: |
            Success. Returns a standard OpenSearch search response; each hit's `_source` is the full stored `Monitor` object.
          content:
            application/json:
              schema:
                type: object
              example:
                took: 2
                timed_out: false
                _shards:
                  total: 1
                  successful: 1
                  skipped: 0
                  failed: 0
                hits:
                  total:
                    value: 1
                    relation: "eq"
                  hits:
                    - _index: ".opensearch-scheduled-jobs"
                      _id: "8x2kQoQBcE4TZ_1qm3aB"
                      _version: 1
                      _source:
                        monitor:
                          name: "high-cpu-alerts-monitor"
                          monitor_type: "query_level_monitor"
                          enabled: true
        '400':
          description: Bad Request - `index` is neither the scheduled-jobs index nor the alerts index pattern.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '408':
          description: Request Timeout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      tags:
        - Monitors
      summary: Search monitors (POST)
      description: Identical to `GET /_plugins/_alerting/monitors/_search`, provided for clients that prefer a request body over a GET-with-body pattern.
      operationId: searchMonitorsPost
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              query:
                match_all: {}
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /_plugins/_alerting/monitors/{monitorID}/_execute:
    post:
      tags:
        - Monitors
      summary: Execute monitor
      description: |
        Runs an existing monitor immediately, outside its schedule.
      operationId: executeMonitor
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: monitorID
          in: path
          required: true
          description: The unique identifier of the monitor to execute.
          schema:
            type: string
          example: "8x2kQoQBcE4TZ_1qm3aB"
        - name: dryrun
          in: query
          description: If true, runs the monitor without persisting any alerts or findings it would generate.
          schema:
            type: boolean
            default: false
        - name: period_end
          in: query
          description: The end of the evaluation period. Defaults to now.
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success. Returned even when no triggers fire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorRunResult'
              example:
                monitor_name: "high-cpu-alerts-monitor"
                period_start: 1755172500000
                period_end: 1755172800000
                error: null
                input_results:
                  results: []
                  error: null
                trigger_results:
                  5f5X8-1kR9uZbg==:
                    name: "high-severity-trigger"
                    triggered: true
                    action_results: {}
                    error: null
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /_plugins/_alerting/monitors/_execute:
    post:
      tags:
        - Monitors
      summary: Execute ad-hoc monitor
      description: |
        Runs an unsaved monitor immediately. The request body is a full monitor definition, with the same shape as monitor creation.
      operationId: executeAdHocMonitor
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: dryrun
          in: query
          description: If true, runs the monitor without persisting any alerts or findings it would generate.
          schema:
            type: boolean
            default: false
        - name: period_end
          in: query
          description: The end of the evaluation period. Defaults to now.
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MonitorRequest'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonitorRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /_plugins/_alerting/monitors/{monitorID}/_acknowledge/alerts:
    post:
      tags:
        - Monitors
      summary: Acknowledge monitor alerts
      description: |
        Acknowledges one or more alerts raised by a monitor.
      operationId: acknowledgeMonitorAlerts
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: monitorID
          in: path
          required: true
          description: The unique identifier of the monitor that raised the alerts.
          schema:
            type: string
          example: "8x2kQoQBcE4TZ_1qm3aB"
        - name: refresh
          in: query
          schema:
            type: string
            enum: [IMMEDIATE, WAIT_UNTIL, NONE]
            default: IMMEDIATE
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - alerts
              properties:
                alerts:
                  type: array
                  description: The IDs of the alerts to acknowledge. Must be non-empty.
                  items:
                    type: string
            example:
              alerts:
                - "alrt_7f3e9c1a"
      responses:
        '200':
          description: |
            Success. The HTTP status stays 200 even if every alert failed to acknowledge — check `success`/`failed` in the body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgeAlertResponse'
              example:
                success:
                  - "alrt_7f3e9c1a"
                failed:
                  - alrt_2b8d4f60:
                      failed_reason: "Alert has already been acknowledged."
        '400':
          description: Bad Request - the alerts array is empty, or the monitor id is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /_plugins/_alerting/monitors/alerts:
    get:
      tags:
        - Monitors
      summary: Get monitor alerts
      description: |
        Returns alerts, optionally filtered by monitor or workflow. By default (`alertState=ALL`), alerts in the `AUDIT` state are excluded — pass `alertState=AUDIT` explicitly to include them.
      operationId: getMonitorAlerts
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: sortString
          in: query
          schema:
            type: string
            default: "monitor_name.keyword"
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: "asc"
        - name: missing
          in: query
          schema:
            type: string
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: startIndex
          in: query
          schema:
            type: integer
            default: 0
        - name: searchString
          in: query
          schema:
            type: string
            default: ""
        - name: severityLevel
          in: query
          schema:
            type: string
            default: "ALL"
        - name: alertState
          in: query
          description: Filters alerts by state. `ALL` excludes `AUDIT`-state alerts.
          schema:
            type: string
            enum: [ALL, ACTIVE, ACKNOWLEDGED, COMPLETED, ERROR, DELETED, AUDIT]
            default: "ALL"
        - name: monitorId
          in: query
          description: Return only alerts raised by this monitor.
          schema:
            type: string
        - name: workflowIds
          in: query
          description: Return only alerts raised by this workflow.
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAlertsResponse'
              example:
                totalAlerts: 1
                alerts:
                  - id: "alrt_7f3e9c1a"
                    version: 1
                    schema_version: 4
                    monitor_id: "8x2kQoQBcE4TZ_1qm3aB"
                    workflow_id: ""
                    workflow_name: ""
                    associated_alert_ids: []
                    monitor_version: 1
                    monitor_name: "high-cpu-alerts-monitor"
                    execution_id: "d3f1a2b4-0000-0000-0000-000000000000"
                    trigger_id: "5f5X8-1kR9uZbg=="
                    trigger_name: "high-severity-trigger"
                    finding_ids: []
                    related_doc_ids: []
                    state: "ACTIVE"
                    error_message: null
                    alert_history: []
                    severity: "1"
                    action_execution_results: []
                    start_time: "2026-08-14T10:00:00.000Z"
                    last_notification_time: "2026-08-14T10:00:00.000Z"
                    end_time: null
                    acknowledged_time: null
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /_plugins/_alerting/workflows:
    post:
      tags:
        - Workflows
      summary: Create workflow
      description: |
        Creates a workflow (a chained sequence of up to 25 existing monitors, evaluated in `order`). A workflow's own triggers are `chained_alert_trigger`s that evaluate across the sequence's results.
      operationId: createWorkflow
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: refresh
          in: query
          schema:
            type: string
            enum: [IMMEDIATE, WAIT_UNTIL, NONE]
            default: IMMEDIATE
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRequest'
            example:
              name: "Suspicious login chained workflow"
              workflow_type: "composite"
              enabled: true
              schedule:
                period:
                  interval: 5
                  unit: "MINUTES"
              inputs:
                - composite_input:
                    sequence:
                      delegates:
                        - order: 1
                          monitor_id: "8x2kQoQBcE4TZ_1qm3aB"
                        - order: 2
                          monitor_id: "9F2kQoQBcE4TZ_1q_3cD"
                          chained_monitor_findings:
                            monitor_id: "8x2kQoQBcE4TZ_1qm3aB"
              triggers:
                - chained_alert_trigger:
                    name: "Any delegate alert fired"
                    severity: "1"
                    condition:
                      script:
                        source: "return true"
                        lang: "painless"
                    actions: []
      responses:
        '201':
          description: Workflow created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexWorkflowResponse'
              example:
                _id: "wf_9a1c2b3d4e5f"
                _version: 1
                _seq_no: 0
                _primary_term: 1
                workflow:
                  name: "Suspicious login chained workflow"
                  workflow_type: "composite"
                  enabled: true
                  owner: "alerting"
                  audit_delegate_monitor_alerts: true
        '400':
          description: |
            Bad Request - missing/invalid fields, more than 25 delegates, duplicate delegate monitor IDs or `order` values, or a chained-findings reference to a delegate with an equal/greater `order`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not Found - one or more delegate monitor IDs don't exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  root_cause:
                    - type: "status_exception"
                      reason: "Monitors not found"
                  type: "status_exception"
                  reason: "Monitors not found"
                status: 404

  /_plugins/_alerting/workflows/{workflowID}:
    put:
      tags:
        - Workflows
      summary: Update workflow
      description: Updates an existing workflow. The request body has the same shape as workflow creation.
      operationId: updateWorkflow
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: workflowID
          in: path
          required: true
          description: The unique identifier of the workflow to update.
          schema:
            type: string
          example: "wf_9a1c2b3d4e5f"
        - name: refresh
          in: query
          schema:
            type: string
            enum: [IMMEDIATE, WAIT_UNTIL, NONE]
            default: IMMEDIATE
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRequest'
      responses:
        '200':
          description: Workflow updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexWorkflowResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not Found - no workflow exists with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  root_cause:
                    - type: "status_exception"
                      reason: "Workflow with wf_9a1c2b3d4e5f is not found"
                  type: "status_exception"
                  reason: "Workflow with wf_9a1c2b3d4e5f is not found"
                status: 404

    get:
      tags:
        - Workflows
      summary: Get workflow
      description: Returns a single workflow by ID.
      operationId: getWorkflow
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: workflowID
          in: path
          required: true
          description: The unique identifier of the workflow.
          schema:
            type: string
          example: "wf_9a1c2b3d4e5f"
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkflowResponse'
              example:
                _id: "wf_9a1c2b3d4e5f"
                _version: 1
                _seq_no: 0
                _primary_term: 1
                workflow:
                  name: "Suspicious login chained workflow"
                  workflow_type: "composite"
                  enabled: true
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            Not Found - no workflow exists with the given ID, its backing document isn't a workflow, or the underlying index doesn't exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    delete:
      tags:
        - Workflows
      summary: Delete workflow
      description: |
        Deletes a workflow by ID. Set `deleteDelegateMonitors=true` to also delete its delegate monitors, but only the ones that don't belong to any other workflow — the rest are reported in `NON_DELETED_MONITORS`.
      operationId: deleteWorkflow
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: workflowID
          in: path
          required: true
          description: The unique identifier of the workflow to delete.
          schema:
            type: string
          example: "wf_9a1c2b3d4e5f"
        - name: deleteDelegateMonitors
          in: query
          description: Also delete delegate monitors that aren't shared with another workflow.
          schema:
            type: boolean
            default: false
        - name: refresh
          in: query
          schema:
            type: string
            enum: [IMMEDIATE, WAIT_UNTIL, NONE]
            default: IMMEDIATE
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Workflow deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                  _version:
                    type: integer
                    format: int64
                  NON_DELETED_MONITORS:
                    type: array
                    description: Delegate monitor IDs that were not deleted because they're shared with another workflow. Only present if `deleteDelegateMonitors=true`.
                    items:
                      type: string
              example:
                _id: "wf_9a1c2b3d4e5f"
                _version: 1
                NON_DELETED_MONITORS:
                  - "8x2kQoQBcE4TZ_1qm3aB"
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          description: Forbidden - not allowed to delete this workflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /_plugins/_alerting/workflows/{workflowID}/_execute:
    post:
      tags:
        - Workflows
      summary: Execute workflow
      description: |
        Runs an existing workflow immediately, executing its delegate monitors in sequence.
      operationId: executeWorkflow
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: workflowID
          in: path
          required: true
          description: The unique identifier of the workflow to execute.
          schema:
            type: string
          example: "wf_9a1c2b3d4e5f"
        - name: dryrun
          in: query
          schema:
            type: boolean
            default: false
        - name: period_end
          in: query
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success. Returned even when no triggers fire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunResult'
              example:
                execution_id: "d3f1a2b4-0000-0000-0000-000000000000"
                workflow_name: "Suspicious login chained workflow"
                workflow_id: "wf_9a1c2b3d4e5f"
                trigger_results:
                  8k2QoQBcE4T:
                    name: "Any delegate alert fired"
                    triggered: true
                    action_results: {}
                    error: null
                monitor_run_results:
                  - monitor_name: "Failed login monitor"
                    period_start: "2026-08-27T10:00:00.000Z"
                    period_end: "2026-08-27T10:05:00.000Z"
                    error: null
                    input_results:
                      results: []
                      error: null
                    trigger_results: {}
                execution_start_time: "2026-08-27T10:05:00.000Z"
                execution_end_time: "2026-08-27T10:05:01.230Z"
                error: null
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not Found - no workflow exists with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  root_cause:
                    - type: "status_exception"
                      reason: "Can't find workflow with id: wf_9a1c2b3d4e5f"
                  type: "status_exception"
                  reason: "Can't find workflow with id: wf_9a1c2b3d4e5f"
                status: 404

  /_plugins/_alerting/workflows/_execute:
    post:
      tags:
        - Workflows
      summary: Execute ad-hoc workflow
      description: |
        Runs an unsaved workflow immediately. The request body is a full workflow definition, with the same shape as workflow creation.
      operationId: executeAdHocWorkflow
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: dryrun
          in: query
          schema:
            type: boolean
            default: false
        - name: period_end
          in: query
          schema:
            type: string
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRequest'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRunResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /_plugins/_alerting/workflows/{workflowID}/_acknowledge/alerts:
    post:
      tags:
        - Workflows
      summary: Acknowledge workflow (chained) alerts
      description: |
        Acknowledges one or more chained alerts raised by a workflow.
      operationId: acknowledgeWorkflowAlerts
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: workflowID
          in: path
          required: true
          description: The unique identifier of the workflow that raised the alerts.
          schema:
            type: string
          example: "wf_9a1c2b3d4e5f"
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - alerts
              properties:
                alerts:
                  type: array
                  description: The IDs of the chained alerts to acknowledge. Must be non-empty.
                  items:
                    type: string
            example:
              alerts:
                - "alrt_7f3e9c1a"
                - "alrt_2b8d4f60"
      responses:
        '200':
          description: |
            Success. The HTTP status stays 200 even if every alert failed to acknowledge — check `success`/`failed` in the body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgeAlertResponse'
              example:
                success:
                  - "alrt_7f3e9c1a"
                failed:
                  - alrt_2b8d4f60:
                      failed_reason: "Alert has already been acknowledged."
        '400':
          description: Bad Request - the alerts array is empty, or the workflow id is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal Server Error - the target workflow record is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /_plugins/_alerting/workflows/alerts:
    get:
      tags:
        - Workflows
      summary: Get workflow alerts
      description: |
        Returns chained (workflow-level) alerts. Set `getAssociatedAlerts=true` to also include the per-delegate-monitor alerts each chained alert aggregates.
      operationId: getWorkflowAlerts
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: sortString
          in: query
          schema:
            type: string
            default: "monitor_name.keyword"
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: "asc"
        - name: missing
          in: query
          schema:
            type: string
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: startIndex
          in: query
          schema:
            type: integer
            default: 0
        - name: searchString
          in: query
          schema:
            type: string
            default: ""
        - name: severityLevel
          in: query
          schema:
            type: string
            default: "ALL"
        - name: alertState
          in: query
          schema:
            type: string
            enum: [ALL, ACTIVE, ACKNOWLEDGED, COMPLETED, ERROR, DELETED, AUDIT]
            default: "ALL"
        - name: workflowIds
          in: query
          description: Return only alerts raised by this workflow.
          schema:
            type: string
        - name: alertIds
          in: query
          description: Return only this specific alert.
          schema:
            type: string
        - name: getAssociatedAlerts
          in: query
          description: Also return the per-delegate-monitor alerts each chained alert aggregates.
          schema:
            type: boolean
            default: false
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWorkflowAlertsResponse'
              example:
                alerts:
                  - id: "alrt_7f3e9c1a"
                    version: 1
                    schema_version: 4
                    monitor_id: ""
                    workflow_id: "wf_9a1c2b3d4e5f"
                    workflow_name: "Suspicious login chained workflow"
                    associated_alert_ids:
                      - "alrt_mon_1"
                      - "alrt_mon_2"
                    monitor_version: -1
                    monitor_name: ""
                    execution_id: "d3f1a2b4-0000-0000-0000-000000000000"
                    trigger_id: "8k2QoQBcE4T"
                    trigger_name: "Any delegate alert fired"
                    finding_ids: []
                    related_doc_ids: []
                    state: "ACTIVE"
                    error_message: null
                    alert_history: []
                    severity: "1"
                    action_execution_results: []
                    start_time: "2026-08-27T10:05:01.000Z"
                    last_notification_time: "2026-08-27T10:05:01.000Z"
                    end_time: null
                    acknowledged_time: null
                associatedAlerts: []
                totalAlerts: 1
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /_plugins/_alerting/findings/_search:
    get:
      tags:
        - Alerting findings
      summary: Search findings
      description: |
        Returns findings, which record when a document-level monitor's queries matched an event, together with the matched documents.
      operationId: searchAlertingFindings
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: findingId
          in: query
          description: Return only this specific finding.
          schema:
            type: string
        - name: sortString
          in: query
          schema:
            type: string
            default: "id"
        - name: sortOrder
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: "asc"
        - name: missing
          in: query
          schema:
            type: string
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: startIndex
          in: query
          schema:
            type: integer
            default: 0
        - name: searchString
          in: query
          schema:
            type: string
            default: ""
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetAlertingFindingsResponse'
              example:
                total_findings: 1
                findings:
                  - finding:
                      id: "fnd_3c8b1a2d"
                      related_doc_ids:
                        - "AZg3x1QoQBcE4TZ_9kLm"
                      correlated_doc_ids: []
                      monitor_id: "8x2kQoQBcE4TZ_1qm3aB"
                      monitor_name: "Failed login monitor"
                      index: "security-logs-2024.01"
                      queries:
                        - id: "q1"
                          name: "failed-login-query"
                          fields: []
                          query: "event.outcome:failure AND event.action:authentication"
                          tags:
                            - "authentication"
                            - "high-severity"
                      timestamp: 1735300800000
                      execution_id: "d3f1a2b4-0000-0000-0000-000000000000"
                    document_list:
                      - index: "security-logs-2024.01"
                        id: "AZg3x1QoQBcE4TZ_9kLm"
                        found: true
                        document: "{\"event\":{\"outcome\":\"failure\",\"action\":\"authentication\"},\"user\":{\"name\":\"jdoe\"}}"
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /_plugins/_alerting/remote/indexes:
    get:
      tags:
        - Alerting remote indexes
      summary: List remote monitoring indexes
      description: |
        Reports health and, optionally, field mappings for local and cross-cluster indexes that monitors can reference. Requires `plugins.alerting.cross_cluster_monitoring_enabled` (default `true`).
      operationId: getRemoteIndexes
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: indexes
          in: query
          required: true
          description: |
            Comma-separated list of index patterns. Each entry is either `<index-pattern>` (local) or `<cluster-pattern>:<index-pattern>` (remote).
          schema:
            type: string
          example: "logs-remote-cluster-2024.01,remote-cluster-1:logs-*"
        - name: include_mappings
          in: query
          description: Include each index's field mappings in the response.
          schema:
            type: boolean
            default: false
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Success. Top-level object keyed dynamically by cluster name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetRemoteIndexesResponse'
              example:
                opensearch-local:
                  cluster: "opensearch-local"
                  health: "green"
                  hub_cluster: true
                  latency: 4
                  indexes:
                    logs-remote-cluster-2024.01:
                      name: "logs-remote-cluster-2024.01"
                      health: "green"
                      mappings: {}
                remote-cluster-1:
                  cluster: "remote-cluster-1"
                  health: "yellow"
                  hub_cluster: false
                  latency: 112
                  indexes:
                    logs-2024.01:
                      name: "logs-2024.01"
                      health: "yellow"
                      mappings: {}
        '400':
          description: Bad Request - `indexes` is empty or contains an invalid pattern.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          description: Forbidden - remote monitoring is not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  root_cause:
                    - type: "status_exception"
                      reason: "Remote monitoring is not enabled."
                  type: "status_exception"
                  reason: "Remote monitoring is not enabled."
                status: 403

  /_plugins/_alerting/comments/{id}:
    post:
      tags:
        - Comments
      summary: Add a comment to an alert
      description: |
        Adds a comment to an alert. Disabled by default — requires `plugins.alerting.comments_enabled` to be set to `true` (its default is `false`). Content is capped at `plugins.alerting.max_comment_character_length` characters (default 2000), and an alert can hold at most `plugins.alerting.max_comments_per_alert` comments (default 500).
      operationId: createAlertComment
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the alert to comment on.
          schema:
            type: string
          example: "alrt_7f3e9c1a"
        - name: if_seq_no
          in: query
          schema:
            type: integer
            format: int64
        - name: if_primary_term
          in: query
          schema:
            type: integer
            format: int64
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
            example:
              content: "Investigating this alert now."
      responses:
        '201':
          description: Comment created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexCommentResponse'
              example:
                _id: "R4T3WXwB9tOWfnfvAlA9"
                _seq_no: 0
                _primary_term: 1
                comment:
                  entity_id: "alrt_7f3e9c1a"
                  entity_type: "alert"
                  content: "Investigating this alert now."
                  created_time: 1735689600000
                  last_updated_time: null
                  user: "admin"
        '400':
          description: |
            Bad Request - missing content, content exceeds the max length, or the alert already holds the maximum number of comments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          description: Forbidden - the Comments feature is disabled (`plugins.alerting.comments_enabled=false`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error:
                  root_cause:
                    - type: "status_exception"
                      reason: "Comments for Alerting is currently disabled"
                  type: "status_exception"
                  reason: "Comments for Alerting is currently disabled"
                status: 403
        '404':
          description: Not Found - the target alert does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    put:
      tags:
        - Comments
      summary: Update a comment
      description: |
        Updates an existing comment's content. Only the comment's author or an admin may edit it.
      operationId: updateAlertComment
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the comment to update.
          schema:
            type: string
          example: "R4T3WXwB9tOWfnfvAlA9"
        - name: if_seq_no
          in: query
          schema:
            type: integer
            format: int64
        - name: if_primary_term
          in: query
          schema:
            type: integer
            format: int64
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
            example:
              content: "Confirmed as a false positive."
      responses:
        '200':
          description: Comment updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IndexCommentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          description: Forbidden - the comment can only be edited by an admin or its author, or the Comments feature is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not Found - the comment does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

    delete:
      tags:
        - Comments
      summary: Delete a comment
      description: |
        Deletes a comment by ID. Only the comment's author or an admin may delete it.
      operationId: deleteAlertComment
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the comment to delete.
          schema:
            type: string
          example: "R4T3WXwB9tOWfnfvAlA9"
        - $ref: 'spec.yml#/components/parameters/pretty'
      responses:
        '200':
          description: Comment deleted successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
              example:
                _id: "R4T3WXwB9tOWfnfvAlA9"
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          description: Forbidden - not allowed to delete this comment, or the Comments feature is disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not Found - the comment does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /_plugins/_alerting/comments/_search:
    get:
      tags:
        - Comments
      summary: Search comments
      description: Searches alert comments using a standard OpenSearch query DSL body. Disabled by default, same as the other comment endpoints.
      operationId: searchAlertComments
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A standard OpenSearch query DSL object.
            example:
              query:
                match:
                  entity_id: "alrt_7f3e9c1a"
      responses:
        '200':
          description: |
            Success. Standard OpenSearch search response; each hit's `_source` is a flat Comment object.
          content:
            application/json:
              schema:
                type: object
              example:
                took: 2
                timed_out: false
                hits:
                  total:
                    value: 1
                    relation: "eq"
                  hits:
                    - _index: ".opensearch-alerting-comments-history-2025.01"
                      _id: "R4T3WXwB9tOWfnfvAlA9"
                      _score: 1.0
                      _seq_no: 0
                      _primary_term: 1
                      _source:
                        entity_id: "alrt_7f3e9c1a"
                        entity_type: "alert"
                        content: "Investigating this alert now."
                        created_time: 1735689600000
                        user: "admin"
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Comments
      summary: Search comments (POST)
      description: Identical to `GET /_plugins/_alerting/comments/_search`.
      operationId: searchAlertCommentsPost
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - $ref: 'spec.yml#/components/parameters/pretty'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: 'spec.yml#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /_plugins/_alerting/destinations/{destinationID}:
    get:
      tags:
        - Destinations
      summary: Get a legacy destination
      description: |
        Returns a single legacy notification destination by ID. Legacy destinations are read-only in this API — creation and deletion moved to the Notifications plugin. An unmatched ID does not 404; it returns an empty `destinations` array.
      operationId: getDestination
      security:
        - basicAuth: []
        - jwtAuth: []
      parameters:
        - name: destinationID
