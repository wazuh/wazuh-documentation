                  current_version: "v5.0.0"
                  last_available_major: {}
                  last_available_minor: {}
                  last_available_patch: {}
                status: 200

    BadGateway:
      description: Bad Gateway - The CTI API returned an error while checking for updates.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RestResponse"
          examples:
            cti_error:
              summary: CTI API error
              value:
                message: "CTI API error"
                status: 502

    # Response body for normalization-only logtest
    LogtestNormalizationResponse:
      description: Engine normalization result containing the decoded event.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                description: HTTP status code.
                example: 200
              message:
                type: object
                properties:
                  output:
                    type: object
                    additionalProperties: true
                    description: Normalized event output from the Engine (Wazuh Common Schema format).
                  asset_traces:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    description: Asset trace information generated during normalization.
                  validation:
                    type: object
                    properties:
                      valid:
                        type: boolean
                        description: Indicates if the event passed engine validation.
                      errors:
                        type: array
                        items:
                          type: string
                        description: List of validation errors if the event is invalid.
          examples:
            success:
              summary: Successful normalization
              value:
                status: 200
                message:
                  output:
                    log:
                      level: "INFO"
                      origin:
                        file:
                          name: "CassandraDaemon.java"
                          line: 250
                    wazuh:
                      space:
                        name: "test"
                      integration:
                        decoders: ["decoder/cassandra-default/0"]
                        name: "my-integration"
                        category: "other"
                    message: "Some message"
                    event:
                      duration: 7500
                      category: ["database"]
                      kind: "event"
                      severity: 4
                  asset_traces: []
                  validation:
                    valid: true
                    errors: []

    # Response body for detection-only logtest
    LogtestDetectionResponse:
      description: Security Analytics detection result with matched Sigma rules.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                description: HTTP status code.
                example: 200
              message:
                type: object
                properties:
                  status:
                    type: string
                    enum: [success, error]
                    example: "success"
                  rules_evaluated:
                    type: integer
                    example: 12
                  rules_matched:
                    type: integer
                    example: 6
                  matches:
                    type: array
                    items:
                      type: object
                      properties:
                        rule:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            title:
                              type: string
                            level:
                              type: string
                              enum: [informational, low, medium, high, critical]
                            tags:
                              type: array
                              items:
                                type: string
                        matched_conditions:
                          type: array
                          items:
                            type: string
          examples:
            with_matches:
              summary: Detection with matched rules
              value:
                status: 200
                message:
                  status: "success"
                  rules_evaluated: 12
                  rules_matched: 2
                  matches:
                    - rule:
                        id: "4e52f215-bccc-4c0f-a37c-70606022be8e"
                        title: "Numeric gte+lt condition"
                        level: "high"
                        tags: ["attack.execution", "attack.t1059"]
                      matched_conditions:
                        - "event.duration matched '>= 5000'"
                        - "event.severity matched '< 10'"
                    - rule:
                        id: "1d489ded-7523-4329-8cd0-ebb21865a318"
                        title: "Exact match event.kind=event"
                        level: "low"
                        tags: ["attack.execution", "attack.t1059"]
                      matched_conditions:
                        - "event.kind matched 'event'"
            no_matches:
              summary: No rules matched
              value:
                status: 200
                message:
                  status: "success"
                  rules_evaluated: 5
                  rules_matched: 0
                  matches: []

    # Response body for logtest execution results (combined engine + SA)
    LogtestResponse:
      description: Combined logtest result with engine output and Security Analytics rule evaluation.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                description: HTTP status code of the logtest execution result.
                example: 200
              message:
                type: object
                properties:
                  normalization:
                    type: object
                    description: >
                      Engine output containing the normalized event and asset traces on success.
                      If the Engine call itself fails (exception or HTTP >= 400 from the Engine),
                      this object instead contains `status` ("error") and `error.message`/
                      `error.code` — `output`/`asset_traces`/`validation` are absent in that case.
                    properties:
                      output:
                        type: object
                        additionalProperties: true
                        description: Normalized event output from the engine (Wazuh Common Schema format).
                      asset_traces:
                        type: array
                        items:
                          type: object
                          additionalProperties: true
                        description: Asset trace information generated during normalization.
                      validation:
                        type: object
                        properties:
                          valid:
                            type: boolean
                            description: Indicates if the event passed engine validation.
                          errors:
                            type: array
                            items:
                              type: string
                            description: List of validation errors if the event is invalid.
                  detection:
                    type: object
                    properties:
                      status:
                        type: string
                        enum: [success, error, skipped]
                        example: "success"
                      reason:
                        type: string
                        description: Present when status is "skipped".
                        example: "Engine processing failed"
                      rules_evaluated:
                        type: integer
                        example: 2
                      rules_matched:
                        type: integer
                        example: 1
                      matches:
                        type: array
                        items:
                          type: object
                          properties:
                            rule:
                              type: object
                              properties:
                                id:
                                  type: string
                                  format: uuid
                                title:
                                  type: string
                                level:
                                  type: string
                                  enum: [informational, low, medium, high, critical]
                                tags:
                                  type: array
                                  items:
                                    type: string
                            matched_conditions:
                              type: array
                              items:
                                type: string
          examples:
            with_matches:
              summary: Response with matching rules
              value:
                status: 200
                message:
                  normalization:
                    output: {}
                    asset_traces: []
                    validation:
                      valid: true
                      errors: []
                  detection:
                    status: "success"
                    rules_evaluated: 5
                    rules_matched: 2
                    matches:
                      - rule:
                          id: "uuid-rule-1"
                          title: "rule/cloudtrail-failed-authentication/0"
                          level: "high"
                          tags:
                            - "authentication"
                            - "aws"
                            - "cloudtrail"
                        matched_conditions:
                          - "event.category == 'authentication'"
                          - "event.outcome == 'failure'"
                          - "cloud.provider == 'aws'"
                      - rule:
                          id: "uuid-rule-2"
                          title: "rule/suspicious-console-login/0"
                          level: "medium"
                          tags:
                            - "suspicious_activity"
                            - "console_login"
                        matched_conditions:
                          - "event.type == 'start'"
                          - "source.ip in suspicious_ips"
            no_matches:
              summary: Response with no matching rules
              value:
                status: 200
                message:
                  normalization:
                    output: {}
                    asset_traces: []
                    validation:
                      valid: true
                      errors: []
                  detection:
                    status: "success"
                    rules_evaluated: 5
                    rules_matched: 0
                    matches: []
            normalization_only:
              summary: Normalization only (no integration provided)
              value:
                status: 200
                message:
                  normalization:
                    output:
                      event:
                        original: "Mar 31 10:00:00 myhost sshd[1234]: Accepted publickey for user from 192.168.1.1 port 22 ssh2"
                    asset_traces: []
                    validation:
                      valid: true
                      errors: []
                  detection:
                    status: "skipped"
                    reason: "No integration provided"
            with_errors:
              summary: Response with engine processing failure
              description: >
                When the Engine call itself fails (exception or HTTP >= 400), `normalization`
                does NOT contain `output`/`asset_traces`/`validation` — it instead contains a
                `status`/`error` object, as shown below.
              value:
                status: 200
                message:
                  normalization:
                    status: "error"
                    error:
                      message: "<engine error details>"
                      code: "ENGINE_ERROR"
                  detection:
                    status: "skipped"
                    reason: "Engine processing failed"

    PromotionPreviewResponse:
      description: Promotion preview result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PolicyDiff"

