name: CI

permissions:
  contents: read

# Keep this file identical on every branch. Branch-specific filters get
# overwritten by upward merges and silently stop the build from running.
on:
  push:
    branches: [ 'main', '[0-9]*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build the documentation
      id: build
      run: |
        mkdir -p build
        make html-quick SPHINXOPTS="-w build/sphinx-warnings.log"

    # Fails the check when the build has any warning, but never blocks merging:
    # no branch protection rule requires this check.
    - name: Report build warnings
      if: ${{ !cancelled() }}
      run: |
        python3 tools/ci/report-sphinx-warnings.py build/sphinx-warnings.log \
          ${{ matrix.python-version == '3.12' && '--annotate' || '' }}

    # Builds the .md copy of every page, the version llms.txt tells AI tools to
    # read. The Markdown builder leaves out markup it can't render and only warns
    # about it, so any warning here means a page's .md copy lost content. It
    # reuses the HTML build's cache, so it runs only when that build finished.
    - name: Build the Markdown version
      id: markdown
      if: ${{ !cancelled() && steps.build.outcome == 'success' }}
      run: |
        make markdown SPHINXOPTS="-w build/markdown-warnings.log"

    - name: Report Markdown build warnings
      if: ${{ !cancelled() && steps.markdown.outcome != 'skipped' }}
      run: |
        python3 tools/ci/report-sphinx-warnings.py build/markdown-warnings.log --title "Markdown build" \
          ${{ matrix.python-version == '3.12' && '--annotate' || '' }}

    - name: Lint llms.txt (content defects only) #Links need verification after publication
      if: ${{ !cancelled() && hashFiles('tools/ci/check-llms-txt.sh') != '' }}
      run: |
        chmod +x tools/ci/check-llms-txt.sh
        tools/ci/check-llms-txt.sh source/llms.txt
