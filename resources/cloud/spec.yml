openapi: 3.0.0
servers:
  - url: https://console.wazuh.com/api/v1
    description: Wazuh Console API
info:
  title: Wazuh Console API
  description: |
    Automate operations on the Wazuh Cloud environments of your organization.

    Every request authenticates with an organization API key sent in the
    `Authorization` header with the `Bearer` scheme. Editors create API keys in
    Wazuh Console, under **Organization** > **API Keys**.
  version: "1.0.0"
paths:
  /platform/environments/{environment_id}/storage/credentials:
    post:
      tags:
        - storage
      operationId: createStorageCredentials
      summary: "Get temporary credentials to access archive data."
      description: |
        Wazuh Cloud archive data is stored in AWS S3. This endpoint returns temporary
        AWS credentials that grant read access (s3:ListBucket and s3:GetObject actions)
        to the archive data of the environment.
      security:
        - api_key: []
      parameters:
        - name: environment_id
          in: path
          required: true
          description: ID of the environment, as shown in the **ID** field of the environment details page in Wazuh Console.
          schema:
            type: string
          example: "0123456789ab"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageCredentialsRequest"

      responses:
        "200":
          description: "Successful"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageCredentialsResponse"
        "401":
          description: "Unauthorized. The API key is missing or invalid, or the environment does not exist or does not belong to the organization of the API key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                errors:
                  detail: "Unauthorized"
        "422":
          description: "Unprocessable entity. The request body is not valid."
        "503":
          description: "Service unavailable. The credentials are temporarily unavailable."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                errors:
                  detail: "Cold storage credentials unavailable"

components:
  securitySchemes:
    api_key:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: "Organization API key sent as `Authorization: Bearer <API_KEY>`."

  schemas:
    StorageCredentialsRequest:
      type: object
      required:
        - token_expiration
      properties:
        token_expiration:
          type: integer
          format: int32
          minimum: 900
          maximum: 43200
          example: 3600
          description: Validity of the credentials, in seconds (900 to 43200, up to 12 hours).
      additionalProperties: false

    StorageCredentialsResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/StorageCredentials"
      additionalProperties: false

    StorageCredentials:
      type: object
      properties:
        access_key_id:
          type: string
          example: "ASIAXXXXXXXXXXXXXXXX"
          description: AWS access key ID.
        secret_access_key:
          type: string
          example: "qEzCk63a224...5aB+e4fC1BR0G"
          description: AWS secret access key.
        session_token:
          type: string
          example: "MRg3t7HIuoA...4o4BXSAcPfUD8"
          description: AWS session token.
        expires_at:
          type: string
          format: date-time
          example: "2026-03-05T16:00:00Z"
          description: Date and time, in UTC, when the credentials expire.
        bucket:
          type: string
          example: "wazuh-cloud-cold-us-east-1/0123456789ab"
          description: S3 location of the archive data of the environment, in the format `wazuh-cloud-cold-<REGION>/<CLOUD_ID>`.
        region:
          type: string
          example: "us-east-1"
          description: AWS region where the archive data is stored.
      additionalProperties: false

    Error:
      type: object
      properties:
        errors:
          type: object
          properties:
            detail:
              type: string
              example: "Unauthorized"
              description: A brief, human-readable description of the error.
      additionalProperties: false
